<!doctype html>
<html lang="en" data-mode="user">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Pod Feature Guide</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <section id="start">
    <div class="card">
      <p class="eyebrow">Pod feature guide</p>
      <h1>Explore this pod.</h1>
      <p class="lead">Point your camera at the pod to see what it is made of and where the features are.</p>
      <button id="startBtn" type="button">Start camera <span aria-hidden="true">&#8599;</span></button>
      <p id="error" role="alert" hidden></p>
      <small>The camera image stays on your device. Nothing is uploaded.</small>
    </div>
  </section>

  <main id="stage" hidden>
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
    <div id="hotspots"></div>

    <div id="hint" role="status"></div>
    <div class="toolbar">
      <button id="resetBtn" type="button">Scan again</button>
    </div>

    <aside id="sheet" hidden aria-live="polite">
      <button id="sheetClose" type="button" aria-label="Close">&times;</button>
      <h2 id="sheetTitle"></h2>
      <p id="sheetText"></p>
      <a id="sheetLink" target="_blank" rel="noopener">Open feature page &#8599;</a>
    </aside>

  </main>

    <div id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <div class="viewer-bar">
        <button id="viewerClose" type="button"><span aria-hidden="true">&larr;</span> Back to camera</button>
        <span id="viewerTitle"></span>
        <a id="viewerOpen" target="_blank" rel="noopener">Open in browser &#8599;</a>
      </div>
      <div class="viewer-body">
        <p id="viewerLoading">Loading&hellip;</p>
        <iframe id="viewerFrame" title="Feature page" referrerpolicy="no-referrer"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
